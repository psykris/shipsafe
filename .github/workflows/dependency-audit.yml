name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify zero runtime dependencies
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              config = tomllib.load(f)
          deps = config.get('project', {}).get('dependencies', [])
          if deps:
              print(f'ERROR: Found runtime dependencies: {deps}')
              print()
              print('ShipSafe must have zero runtime dependencies.')
              print('The scanner runs on Python stdlib only.')
              print()
              print('If you need an external library, add it to')
              print('[project.optional-dependencies] instead.')
              exit(1)
          print('Zero dependencies: CONFIRMED')
          print('pyproject.toml dependencies = []')
          "
