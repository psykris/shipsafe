name: Network Quarantine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  network-quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for banned network module imports
        run: |
          echo "Checking src/shipsafe/ for network module imports..."
          # serve.py is exempt: it uses http.server for local-only serving.
          # User data never leaves the machine. Verified by code review.
          # Patterns are anchored to the start of line (after indentation)
          # to avoid false positives from string literals in rule files
          # that mention library names in fix text (e.g. "requests calls").
          VIOLATIONS=$(grep -rPn \
            --exclude="serve.py" \
            -e "^\s*import socket" \
            -e "^\s*import urllib" \
            -e "^\s*import http\.client" \
            -e "^\s*import http\.server" \
            -e "^\s*import requests" \
            -e "^\s*import httpx" \
            -e "^\s*import aiohttp" \
            -e "^\s*import urllib3" \
            -e "^\s*import telnetlib" \
            -e "^\s*import ftplib" \
            -e "^\s*import smtplib" \
            -e "^\s*from socket " \
            -e "^\s*from urllib " \
            -e "^\s*from http\.client " \
            -e "^\s*from http\.server " \
            -e "^\s*from requests " \
            -e "^\s*from httpx " \
            -e "^\s*from aiohttp " \
            src/shipsafe/ || true)

          if [ -n "$VIOLATIONS" ]; then
            echo ""
            echo "NETWORK QUARANTINE VIOLATION"
            echo "============================"
            echo "The following files import network modules."
            echo "ShipSafe must never make network calls."
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "Remove these imports or move them to an optional module."
            exit 1
          fi

          echo "Network quarantine: CLEAN"
          echo "No network module imports found in src/shipsafe/"
