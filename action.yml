name: ShipSafe Scan
description: Run ShipSafe against a repository and emit a report file.
inputs:
  path:
    description: File or directory to scan.
    required: false
    default: .
  format:
    description: Output format to write.
    required: false
    default: sarif
  output:
    description: Path to the generated report file.
    required: false
    default: shipsafe-report.sarif
  fail-on:
    description: Comma-separated severities that should fail the action.
    required: false
    default: critical,high
  python-version:
    description: Python version used to run the scan.
    required: false
    default: "3.12"
outputs:
  report-path:
    description: Path to the generated report file.
    value: ${{ steps.scan.outputs.report_path }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install ShipSafe
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - id: scan
      name: Run ShipSafe
      continue-on-error: true
      shell: bash
      run: |
        echo "report_path=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
        python -m shipsafe scan "${{ inputs.path }}" \
          --format "${{ inputs.format }}" \
          --output "${{ inputs.output }}" \
          --fail-on "${{ inputs.fail-on }}"
